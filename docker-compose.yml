services:
  postgres:
    image: postgres:17-alpine
    container_name: trace-postgres
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    ports:
      - "${TRACE_DB_PORT:-5433}:5432"
    volumes:
      - trace-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  trace-pgdata:
