<!doctype html>
<html lang="pt-BR">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Trace Sobreposição</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="question.css">
<link rel="stylesheet" href="recon.css">

<a class="skip" href="#main">Pular para o conteúdo</a>
<header class="bar">
  <a class="brand" href="#mapa" aria-label="Trace, ir para o mapa">
    <svg viewBox="0 0 30 30" aria-hidden="true">
      <circle cx="12" cy="15" r="8" fill="#5b8cff"/>
      <circle cx="18" cy="15" r="8" fill="#ff4fa3" style="mix-blend-mode:multiply"/>
      <path d="M15 1.5v6M15 22.5v6M1.5 15h3M25.5 15h3" stroke="#121419" stroke-width="1.3"/>
    </svg>
    <span>Trace</span>
  </a>
  <div class="ws"><button class="ws-btn" id="wsBtn" type="button" aria-haspopup="menu" aria-expanded="false"><b id="wsName">Demonstração</b><span aria-hidden="true">▾</span></button><span class="tag-syn">dados sintéticos</span><button class="proto-btn" id="protoBtn" type="button">o que é real?</button></div>
  <div class="ws-menu" id="wsMenu" role="menu" hidden></div>
  <nav class="nav" aria-label="Lugares do espaço">
    <a href="#mapa" data-nav="mapa">Mapa <span class="count" id="navMapCount"></span></a>
    <a href="#pergunta" data-nav="pergunta">Perguntas</a>
    <a href="#comparacao" data-nav="comparacao">Comparações</a>
  </nav>
  <button class="search" id="openPalette" type="button" aria-haspopup="dialog"><span class="lbl">O que você quer saber?</span><kbd>⌘K</kbd>
    <svg class="mag" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 12l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
</header>
<nav class="trail" id="trail" aria-label="Rastro da investigação"></nav>
<div class="ws-mini"><button type="button" id="wsMiniBtn" aria-haspopup="menu"><b id="wsMiniName">Demonstração</b> ▾</button><span class="tag-syn">sintético</span><button type="button" id="protoMini" class="proto-btn" aria-label="O que é real nesta página">?</button></div>
<main id="main">
  <section class="screen" id="screen-mapa" data-screen="mapa" aria-label="Mapa de dados" hidden></section>
  <section class="screen scrolls" id="screen-pergunta" data-screen="pergunta" aria-label="Pergunta" hidden></section>
  <section class="screen" id="screen-comparacao" data-screen="comparacao" aria-label="Comparação" hidden></section>
</main>
<div class="palette-back" id="paletteBack" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="O que você quer saber?">
    <input id="paletteInput" type="text" autocomplete="off" placeholder="Tabelas, colunas, cozinhas, períodos…" aria-controls="paletteList" aria-activedescendant="">
    <ul id="paletteList" role="listbox" aria-label="Sugestões"></ul>
    <p class="hint">Sugestões montadas a partir do modelo: tabelas, relações confirmadas, valores e períodos. Sem IA.</p>
  </div>
</div>
<div class="about-back" id="aboutBack" hidden><div class="about" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" id="about"></div></div>
<div class="busy" id="busy" hidden><p></p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" aria-hidden="true"></div>
<div class="sr" id="announce" aria-live="polite"></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
<script src="map.js"></script>
<script src="question.js"></script>
<script src="recon.js"></script>
<script>App.start();</script>
</html>
